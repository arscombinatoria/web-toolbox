name: CI and Pages

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - run: npm run test:badge
      - name: Upload coverage summary
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-summary
          path: coverage/coverage-summary.json
          retention-days: 1
          if-no-files-found: error
          overwrite: true

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Upload build output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-dist
          path: dist
          retention-days: 1
          if-no-files-found: error
          overwrite: true

  e2e:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/2', '2/2']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Download build output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-dist
          path: dist
      - run: npx playwright install --with-deps --only-shell chromium firefox
      - run: npm run test:e2e -- --workers=3 --shard=${{ matrix.shard }}

  ci:
    needs: [unit, build, e2e]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require all validation jobs to succeed
        if: ${{ always() }}
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          test "$UNIT_RESULT" = success
          test "$BUILD_RESULT" = success
          test "$E2E_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ needs.unit.result == 'success' && needs.build.result == 'success' && needs.e2e.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ needs.unit.result == 'success' && needs.build.result == 'success' && needs.e2e.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        with:
          node-version-file: .nvmrc
      - name: Download build output
        if: ${{ needs.unit.result == 'success' && needs.build.result == 'success' && needs.e2e.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-dist
          path: dist
      - name: Download coverage summary
        if: ${{ needs.unit.result == 'success' && needs.build.result == 'success' && needs.e2e.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-summary
          path: coverage
      - name: Generate coverage badge
        if: ${{ needs.unit.result == 'success' && needs.build.result == 'success' && needs.e2e.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: node scripts/generate-coverage-badge.mjs
      - name: Upload GitHub Pages artifact
        if: ${{ needs.unit.result == 'success' && needs.build.result == 'success' && needs.e2e.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
