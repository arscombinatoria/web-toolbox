name: Temporary Playwright benchmark
on:
  push:
    branches: [perf/playwright-ci]
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mode: full, workers: 2 }
          - { mode: shell, workers: 2 }
          - { mode: shell, workers: 3 }
          - { mode: shell, workers: 4 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - run: npm run test:badge
      - run: npm run build
      - name: Install browsers
        run: npx playwright install --with-deps ${{ matrix.mode == 'shell' && '--only-shell' || '' }} chromium firefox
      - name: E2E sample 1
        run: npx playwright test --workers=${{ matrix.workers }}
      - name: E2E sample 2
        if: ${{ !cancelled() }}
        run: npx playwright test --workers=${{ matrix.workers }}
      - name: E2E sample 3
        if: ${{ !cancelled() }}
        run: npx playwright test --workers=${{ matrix.workers }}
